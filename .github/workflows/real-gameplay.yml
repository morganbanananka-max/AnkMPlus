name: Real Minecraft Steve auto-hit GameTest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Install virtual display and software OpenGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglu1-mesa
      - name: Run real Minecraft world auto-hit / no-cheat scenarios
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Dfabric.client.gametest.disableNetworkSynchronizer=true"
        run: |
          set -o pipefail
          timeout 600s gradle --no-daemon --console=plain runClientGameTest 2>&1 | tee real-gameplay.log
          grep -F "[AnkM+ GameTest] PASS: no off-target hits; no wall hits; Steve damaged" real-gameplay.log
          grep -F "[AnkM+ GameTest] PASS: real Elytra/chestplate swap and original hotbar restoration" real-gameplay.log
      - name: Save Minecraft client game test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ankmplus-real-gameplay-log
          path: |
            real-gameplay.log
            build/run/clientGameTest/screenshots
          if-no-files-found: ignore
