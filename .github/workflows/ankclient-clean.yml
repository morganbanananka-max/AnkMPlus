name: Build AnkClient Clean 1.21.11
on:
  push:
    branches: [ankclient-clean-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ankclient:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Extract AnkClient clean source
        run: |
          mkdir -p ankclient
          base64 --decode ankclient-source.tar.gz.b64 | tar -xz -C ankclient
          test -f ankclient/src/main/resources/fabric.mod.json
      - name: Target Fabric Loader 0.19.3
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ankclient/gradle.properties")
          source = p.read_text()
          assert "loader_version=0.19.5" in source
          p.write_text(source.replace("loader_version=0.19.5", "loader_version=0.19.3"))
          p = Path("ankclient/src/main/resources/fabric.mod.json")
          source = p.read_text()
          assert '">=0.19.5"' in source
          p.write_text(source.replace('">=0.19.5"', '">=0.19.3"'))
          PY
      - name: Correct Minecraft 1.21.11 armor API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ankclient/src/main/java/se/ankclient/Overlay.java")
          text = p.read_text()
          old = "for(ItemStack armor:mc.player.getArmorItems()) {"
          new = "for (net.minecraft.entity.EquipmentSlot slot : new net.minecraft.entity.EquipmentSlot[] {net.minecraft.entity.EquipmentSlot.HEAD, net.minecraft.entity.EquipmentSlot.CHEST, net.minecraft.entity.EquipmentSlot.LEGS, net.minecraft.entity.EquipmentSlot.FEET}) {\n                ItemStack armor = mc.player.getEquippedStack(slot);"
          assert old in text
          p.write_text(text.replace(old, new))
          PY
      - name: Compile and remap installable Fabric JAR
        working-directory: ankclient
        run: gradle --no-daemon --console=plain clean build
      - name: Check installable artifact
        run: |
          ls -lah ankclient/build/libs
          test -s ankclient/build/libs/ankclient-clean-0.1.0.jar
      - name: Upload AnkClient jar
        uses: actions/upload-artifact@v4
        with:
          name: AnkClient-Clean-1.21.11
          path: ankclient/build/libs/ankclient-clean-0.1.0.jar
          if-no-files-found: error
