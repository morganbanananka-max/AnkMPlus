name: AnkHack 0.4 Rebuild
on:
  push:
    branches: [ankhack-rebuild-v04]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Restore original source, guarded multiplayer updates and redesigned GUI
        run: |
          set -euo pipefail
          mkdir -p ankhack
          base64 -d ankhack-source.tar.gz.b64 | tar -xz -C ankhack
          cat ankhack-v03.part1 ankhack-v03.part2 ankhack-v03.part3 | base64 -d | tar -xJ -C ankhack
          python3 - <<'PY'
          from pathlib import Path
          p=Path("ankhack/src/main/java/se/ankclient/ExtraFeatures.java")
          s=p.read_text().replace('            {"ping_hud","Ping","Connection round-trip time","HUD"},\n','')
          p.write_text(s)
          p=Path("ankhack/src/main/java/se/ankclient/ExtraOverlay.java")
          s=p.read_text().replace('if(enabled(mods,"entities_hud"))info.add("Entities: "+w.getEntities().size());','if(enabled(mods,"entities_hud")){int count=0;for(var entity:w.getEntities())count++;info.add("Entities: "+count);}')
          p.write_text(s)
          PY
          python3 fix_essential_031.py
          base64 -d ankhack-v04-overlay.tar.xz.b64 | tar -xJ -C ankhack
          test -f ankhack/src/main/java/se/ankclient/ClickGuiScreen.java
          grep -F 'GLFW.GLFW_KEY_F9' ankhack/src/main/java/se/ankclient/AnkHack.java
          sed -i 's/mod_version=0.3.1/mod_version=0.4.0/' ankhack/gradle.properties
      - name: Compile and remap for Minecraft 1.21.11 Fabric Loader 0.19.3
        working-directory: ankhack
        run: gradle --no-daemon --console=plain clean build
      - name: Verify installable JAR
        run: |
          test -s ankhack/build/libs/AnkHack-1.21.11-0.4.0.jar
          unzip -p ankhack/build/libs/AnkHack-1.21.11-0.4.0.jar fabric.mod.json | grep -F '"id": "ankhack"'
          unzip -p ankhack/build/libs/AnkHack-1.21.11-0.4.0.jar fabric.mod.json | grep -F '0.19.3'
      - name: Upload core JAR
        uses: actions/upload-artifact@v4
        with:
          name: AnkHack-0.4.0-Core-Fabric-1.21.11
          path: ankhack/build/libs/AnkHack-1.21.11-0.4.0.jar
          if-no-files-found: error
