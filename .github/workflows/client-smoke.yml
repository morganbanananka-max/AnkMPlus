name: Minecraft 1.21.11 client launch smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1.1'
      - name: Run Minecraft client in virtual display
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglu1-mesa
          set +e
          timeout 160s xvfb-run -a -s "-screen 0 1280x800x24" \
            gradle --no-daemon --console=plain runClient > client-start.log 2>&1
          STATUS=$?
          set -e
          echo "Client command result: $STATUS (124 is normal test timeout)"
          tail -n 120 client-start.log
          if grep -q '\[AnkM+ 9.6.1\] client ready' client-start.log; then
            echo "PASS: Minecraft initialized AnkM+ 9.6.1."
          else
            echo "FAIL: Minecraft did not initialize AnkM+ 9.6.1."
            exit 1
          fi
      - name: Save client startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-client-smoke-log
          path: client-start.log
          if-no-files-found: ignore
