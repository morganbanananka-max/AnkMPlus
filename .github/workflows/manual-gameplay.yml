name: Minecraft manual Mace and Stunslam GameTest

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Install Xvfb and OpenGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglu1-mesa
      - name: Run actual 1.21.11 manual shield tests
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          ALSOFT_DRIVERS: "null"
        run: |
          set -o pipefail
          : > manual-gameplay.log
          for attempt in 1 2 3; do
            echo "===== MINECRAFT ATTEMPT $attempt =====" | tee -a manual-gameplay.log
            set +e
            timeout 240s xvfb-run -a -s "-screen 0 1280x800x24" \
              gradle --no-daemon --console=plain runClientGameTest \
              > manual-gameplay-attempt.log 2>&1
            result=$?
            set -e
            cat manual-gameplay-attempt.log >> manual-gameplay.log
            grep -E "GameTest.*PASS|AssertionError|Timeout loading world|BUILD (SUCCESSFUL|FAILED)" \
              manual-gameplay-attempt.log | tail -n 20 || true
            if [ "$result" -eq 0 ] && \
              grep -Fq "[AnkM+ Manual GameTest] PASS: no auto-hit; no ground Mace; shield Axe then Mace with manual clicks" manual-gameplay-attempt.log; then
              echo "GameTest PASS on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt did not pass, exit=$result"
          done
          echo "Manual Stunslam never passed"
          exit 1
      - name: Save game test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ankmplus-manual-gametest-log
          path: manual-gameplay.log
          if-no-files-found: ignore
