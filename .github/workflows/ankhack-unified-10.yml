name: Build AnkHack Unified 1.0 (full source fork)
on:
  push:
    branches: [ankhack-unified-10]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Get full original 1.21.11 Meteor source
        run: |
          git clone https://github.com/MeteorDevelopment/meteor-client.git upstream
          cd upstream
          git checkout 02973974afdfb715b193813959a837695049f7c1
          git rev-parse HEAD
      - name: Integrate open source under the one AnkHack identity
        run: |
          python3 unified/patch_unified.py
          test -f upstream/src/main/java/meteordevelopment/meteorclient/systems/modules/movement/AnkBoatFly.java
          test -f upstream/src/main/java/meteordevelopment/meteorclient/systems/modules/misc/AnkAutoLeave.java
      - name: Compile real Minecraft 1.21.11 client with Gradle
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain build -x test
      - name: Check actual client module classes and single mod ID
        run: |
          set -euo pipefail
          find upstream/build/libs -maxdepth 1 -type f -printf '%f %s bytes\n'
          JAR=$(find upstream/build/libs -maxdepth 1 -name 'AnkHack-Unified-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-javadoc.jar' | head -1)
          test -s "$JAR"
          unzip -p "$JAR" fabric.mod.json | grep '"id": "ankhack"'
          jar tf "$JAR" | grep 'AnkBoatFly.class'
          jar tf "$JAR" | grep 'AnkAutoLeave.class'
          echo "Built classes: $(jar tf "$JAR" | grep -c '.class$')"
          cp "$JAR" AnkHack-Unified-1.0-1.21.11.jar
          printf '%s\n' 'AnkHack Unified source attribution and GPL-3.0 available in SOURCE artifact' > BUILD_INFO.txt
          tar --exclude=.git --exclude=.gradle --exclude=build -czf AnkHack-Unified-1.0-SOURCE.tar.gz -C upstream .
      - uses: actions/upload-artifact@v4
        with:
          name: AnkHack-Unified-1.0-Fabric-1.21.11
          path: |
            AnkHack-Unified-1.0-1.21.11.jar
            BUILD_INFO.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AnkHack-Unified-1.0-GPL-SOURCE
          path: AnkHack-Unified-1.0-SOURCE.tar.gz
          if-no-files-found: error
